services:
  - type: web
    name: ormuri-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: PORT
        value: 10000
