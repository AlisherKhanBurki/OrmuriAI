<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
  
  <!-- Ormuri Emblem: Calligraphic اُ -->
  <text x="32" y="44" 
        font-family="'Noto Nastaliq Urdu', 'Amiri', 'Arial', sans-serif" 
        font-size="34" 
        font-weight="bold" 
        fill="#042F2E" 
        text-anchor="middle"
        filter="url(#shadow)">اُ</text>
</svg>
