<svg class="brand-logo-emblem-svg" viewBox="0 0 120 88" width="52" height="38" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="اُرمَڑی (Ormuri)">
  <defs>
    <!-- Deep Classic Forest Slate Gradient (Subtle & Dignified, No Neon Slop) -->
    <linearGradient id="emblemBase" x1="0" y1="0" x2="120" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#072019"/>
      <stop offset="60%" stop-color="#051712"/>
      <stop offset="100%" stop-color="#030E0B"/>
    </linearGradient>

    <!-- Warm Heritage Gold Border (Restrained, Classic Academic) -->
    <linearGradient id="emblemBorder" x1="0" y1="0" x2="120" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#065F46" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="textDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Badge -->
  <rect x="2" y="2" width="116" height="84" rx="10" fill="url(#emblemBase)" stroke="url(#emblemBorder)" stroke-width="1.8" filter="url(#badgeShadow)"/>

  <!-- Inner Precision Inset Hairline -->
  <rect x="5.5" y="5.5" width="109" height="77" rx="7.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Top Subtle Specular Light -->
  <path d="M 8 14 C 8 9, 12 7, 18 7 L 102 7 C 108 7, 112 9, 112 14 L 112 24 C 85 20, 35 20, 8 24 Z" fill="rgba(255, 255, 255, 0.035)"/>

  <!-- Heritage Preservation Beacon (Warm Gold Accent) -->
  <circle cx="16" cy="15" r="2.2" fill="#D4AF37"/>
  <circle cx="16" cy="15" r="4.2" fill="none" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="0.8"/>

  <!-- Corpus Node Accent (Deep Emerald) -->
  <circle cx="104" cy="15" r="2" fill="#10B981" fill-opacity="0.8"/>

